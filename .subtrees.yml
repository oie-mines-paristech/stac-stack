# Git subtrees under services/ — source of truth for scripts/sync-subtree.sh
# OIE-owned services (zarr-viewer, stac-generator) are git submodules instead; see README.
subtrees:
  stac-fastapi-static:
    path: services/stac-fastapi-static
    remote: https://github.com/fntb/stac-fastapi-static.git
    branch: main
    remote_name: stac-fastapi-static

  stac-browser:
    path: services/stac-browser
    remote: git@github.com:eu-cdse/stac-browser-cdse.git
    branch: main
    remote_name: cdse
