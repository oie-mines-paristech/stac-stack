

services:

  stac-generator:
    volumes:
      - ./services/stac-generator/src:/app/src
      - ./services/stac-generator/main.py:/app/main.py
      - ./services/stac-generator/schemas:/app/schemas
    environment:
      WATCH_DEBOUNCE: "2"
      # Reload generate-stac when a .py source file changes (see entrypoint.sh).
      DEV: "1"

  browser:
    build:
      context: ./services/stac-browser
      target: dev
    image: stac-oie-browser:dev
    depends_on:
      zarr-viewer:
        condition: service_healthy
    environment:
      DEV: "1"
      VUE_CLI_LINT: "false"
    volumes:
      - ./services/stac-browser/src:/app/src
      - ./services/stac-browser/package.json:/app/package.json
      - ./services/stac-browser/package-lock.json:/app/package-lock.json
      - ./services/stac-browser/config.js:/app/config.js
      - ./services/stac-browser/fields.config.js:/app/fields.config.js
      - ./services/stac-browser/assetActions.config.js:/app/assetActions.config.js
      - ./services/stac-browser/linkActions.config.js:/app/linkActions.config.js
      - ./services/stac-browser/basemaps.config.js:/app/basemaps.config.js
      - ./services/stac-browser/codeGenerators.config.js:/app/codeGenerators.config.js
      - ./services/stac-browser/relationTypes.config.js:/app/relationTypes.config.js
      - ./services/stac-browser/stacActions.config.js:/app/stacActions.config.js
      - ./services/stac-browser/widgets.config.js:/app/widgets.config.js
      # vite restarts itself when its config changes, so mount it too.
      - ./services/stac-browser/vite.config.js:/app/vite.config.js
      # Dev only: vite's publicDir serves /app/public, so expose the branding
      # assets (/branding/*) through it. In prod serve.js statics /branding/.
      - ./branding:/app/public/branding:ro

  zarr-viewer:
    build:
      context: ./services/zarr-viewer
      target: dev
    # Distinct tag: sharing the runtime image tag (ghcr …:latest) made plain
    # `up` reuse the runtime image — alpine, no node — while DEV=1 asked the
    # entrypoint for npx. Same reason stac-browser uses stac-oie-browser:dev.
    image: stac-oie-zarr-viewer:dev
    environment:
      DEV: "1"
    restart: unless-stopped
    volumes:
      - ./services/zarr-viewer:/app
      - zarr-viewer-node-modules:/app/node_modules
      - zarr-viewer-static:/out
    healthcheck:
      test: ["CMD-SHELL", "test -f /out/index.html"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s

  notebook-viewer:
    build:
      context: ./services/notebook-viewer
      target: dev
    image: stac-oie-notebook-viewer:dev
    environment:
      DEV: "1"
    restart: unless-stopped
    volumes:
      - ./services/notebook-viewer:/app
      - notebook-viewer-node-modules:/app/node_modules
      - notebook-viewer-static:/out
    healthcheck:
      test: ["CMD-SHELL", "test -f /out/index.html"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s

volumes:
  zarr-viewer-node-modules:
  notebook-viewer-node-modules: