services:

  stac-generator:
    build: ./services/stac-generator
    restart: unless-stopped
    environment:
      INPUT_DIR: /data
      OUTPUT_DIR: /catalog
      ROOT_HREF: /data
      VIEWER_URL: ${EXTERNAL_URL}viewer/
    volumes:
      - ./volumes/data:/data:ro
      - ./volumes/catalog:/catalog

  browser:
    build:
      context: ./services/stac-browser
      dockerfile: Dockerfile.oie
    restart: unless-stopped
    depends_on:
      static-api:
        condition: service_started
      stac-generator:
        condition: service_healthy
      zarr-viewer:
        condition: service_completed_successfully
    environment:
      SB_catalogUrl: "/api/"
      SB_allowExternalAccess: "true"
      SB_itemsPerPage: "100"
      SB_catalogTitle: "OIE - MinesParis PSL - STAC catalog"
      SB_catalogTitleAfterImage: "STAC Browser"
      SB_catalogImage: "/branding/logo.svg"
      SB_favicon: "/branding/favicon.svg"
      SB_css: "/branding/org.css"
      SB_footerLinks: "[]"
      SB_authConfig: "null"
      SB_transactions: "off"
      SB_widgetConfigs: '{"view-catalog-catalogs-start":[{"id":"Featured","props":{"entities":["fisheye"]}}]}'
    volumes:
      - ./branding:/branding:ro

  # ⚠ SUPPLY CHAIN: nginx is built FROM the third-party image hakwerk/nginx-dav
  # (official nginx + statically-compiled arut/nginx-dav-ext-module), pinned by
  # SHA256 digest in services/nginx/Dockerfile. NOT an official Docker/nginx build —
  # review https://github.com/hakwerk/nginx-dav and the digest before bumping.
  # Full audit of every base image: README → « Supply chain ».
  nginx:
    build: ./services/nginx
    image: stac-oie-nginx:local
    restart: unless-stopped
    environment:
      NGINX_HTTP_PORT: "8080"
      NGINX_UID: "${NGINX_UID:-1000}"
      NGINX_GID: "${NGINX_GID:-1000}"
      WEBDAV_ADMIN: "${WEBDAV_ADMIN:-}"
      WEBDAV_PASSWORD: "${WEBDAV_PASSWORD:-}"
    ports:
      - "${HTTP_PORT:-8000}:8080"
    depends_on:
      - static-api
      - browser
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./volumes/data:/data:rw
      - ./volumes/data:/davroot/data:rw
      - ./volumes/catalog:/davroot/catalog:ro
      - zarr-viewer-static:/usr/share/nginx/html/viewer:ro

  zarr-viewer:
    build: ./services/zarr-viewer
    volumes:
      - zarr-viewer-static:/out
    environment:
      DEV: "0"

  static-api:
    build: ./services/stac-fastapi-static
    restart: unless-stopped
    depends_on:
      stac-generator:
        condition: service_healthy
    environment:
      catalog_href: file:///catalog/catalog.json
      root_path: /api/
      app_port: "80"
      app_host: "0.0.0.0"
    volumes:
      - ./volumes/catalog:/catalog:ro

volumes:
  zarr-viewer-static:
