services:

  stac-generator:
    build: ./services/stac-generator
    restart: unless-stopped
    environment:
      INPUT_DIR: /data
      OUTPUT_DIR: /catalog
      ROOT_HREF: /data
      VIEWER_URL: http://localhost:${HTTP_PORT:-8000}/viewer/
      WATCH_DEBOUNCE: "5"
    healthcheck:
      test: ["CMD-SHELL", "test -f /catalog/catalog.json && grep -qx OK /catalog/status.log"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    volumes:
      - ./volumes/data:/data:ro
      - ./volumes/catalog:/catalog

  browser:
    build: ./services/stac-browser
    restart: unless-stopped
    depends_on:
      static-api:
        condition: service_started
      stac-generator:
        condition: service_healthy
      zarr-viewer:
        condition: service_completed_successfully
    environment:
      SB_allowExternalAccess: "true"
      SB_itemsPerPage: "100"

  nginx:
    image: nginx:1-alpine
    restart: unless-stopped
    environment:
      NGINX_HTTP_PORT: "8080"
      NGINX_HTTPS_PORT: "8443"
    ports:
      - "${HTTP_PORT:-8000}:8080"
    depends_on:
      - static-api
      - browser
    volumes:
      - ./services/nginx/nginx.conf.template:/etc/nginx/nginx.conf:ro
      - ./services/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./volumes/data:/data:ro
      - zarr-viewer-static:/usr/share/nginx/html/viewer:ro

  zarr-viewer:
    build: ./services/zarr-viewer
    volumes:
      - zarr-viewer-static:/out
    environment:
      DEV: "0"

  static-api:
    build: ./services/stac-fastapi-static
    restart: unless-stopped
    depends_on:
      stac-generator:
        condition: service_healthy
    environment:
      catalog_href: file:///catalog/catalog.json
      root_path: /api/
      app_port: "80"
      app_host: "0.0.0.0"
    volumes:
      - ./volumes/catalog:/catalog:ro

volumes:
  zarr-viewer-static:
