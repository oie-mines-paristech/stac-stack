# Provenance stamped on every first-party image by scripts/release.sh.
# `unreleased` means the image was built outside a release: never publish it as
# a version. Renovation tools and `docker inspect` read the revision back.
x-oci-labels: &oci-labels
  org.opencontainers.image.source: "https://git.sophia.minesparis.psl.eu/oie/stac-oie"
  org.opencontainers.image.revision: "${STACK_REVISION:-unreleased}"
  org.opencontainers.image.version: "${STACK_VERSION:-dev}"

services:

  stac-generator:
    image: ${STACK_REGISTRY:-ghcr.io/oie-mines-paristech}/stac-stack-generator:${STACK_VERSION:-latest}
    build:
      context: ./services/stac-generator
      labels: *oci-labels
    restart: unless-stopped
    environment:
      INPUT_DIR: /data
      OUTPUT_DIR: /catalog
      ROOT_HREF: /data
      VIEWER_URL: ${EXTERNAL_URL}viewer/
      # TTL cache of remote THREDDS catalogs + their OPeNDAP descriptors, so a
      # poll never re-reads remote metadata.
      CACHE_DIR: /cache
    volumes:
      - ./volumes/data:/data:ro
      - ./volumes/catalog:/catalog
      - ./volumes/cache:/cache

  browser:
    image: ${STACK_REGISTRY:-ghcr.io/oie-mines-paristech}/stac-stack-browser:${STACK_VERSION:-latest}
    build:
      context: ./services/stac-browser
      dockerfile: Dockerfile.oie
      labels: *oci-labels
    restart: unless-stopped
    depends_on:
      static-api:
        condition: service_started
      stac-generator:
        condition: service_healthy
      zarr-viewer:
        condition: service_completed_successfully
    environment:
      SB_catalogUrl: "/api/"
      SB_allowExternalAccess: "true"
      SB_itemsPerPage: "100"
      # Shown in the footer next to the STAC Browser credit. STACK_VERSION is
      # exported by the Makefile from the VERSION file.
      SB_stackVersion: "${STACK_VERSION:-dev}"
      SB_stackUrl: "https://git.sophia.minesparis.psl.eu/oie/stac-oie"
    volumes:
      - ./branding:/branding:ro

  # ⚠ SUPPLY CHAIN: nginx is built FROM the third-party image hakwerk/nginx-dav
  # (official nginx + statically-compiled arut/nginx-dav-ext-module), pinned by
  # SHA256 digest in services/nginx/Dockerfile. NOT an official Docker/nginx build —
  # review https://github.com/hakwerk/nginx-dav and the digest before bumping.
  # Full audit of every base image: README → « Supply chain ».
  nginx:
    image: ${STACK_REGISTRY:-ghcr.io/oie-mines-paristech}/stac-stack-nginx:${STACK_VERSION:-latest}
    build:
      context: ./services/nginx
      labels: *oci-labels
    restart: unless-stopped
    environment:
      NGINX_HTTP_PORT: "8080"
      NGINX_UID: "${NGINX_UID:-1000}"
      NGINX_GID: "${NGINX_GID:-1000}"
      WEBDAV_ADMIN: "${WEBDAV_ADMIN:-}"
      WEBDAV_PASSWORD: "${WEBDAV_PASSWORD:-}"
    ports:
      # Set BIND_ADDR=127.0.0.1 to keep nginx off the public interface when the
      # `tls` profile is on and Caddy is the only entry point.
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-8000}:8080"
    depends_on:
      - static-api
      - browser
      - zarr-subset-zip
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./volumes/data:/data:rw
      - ./volumes/data:/dav/data:rw
      - ./volumes/catalog:/dav/catalog:ro
      - zarr-viewer-static:/usr/share/nginx/html/viewer:ro
      - notebook-viewer-static:/usr/share/nginx/html/notebook-viewer:ro

  # ⚡ OPTIONAL TLS TERMINATION — profile `tls`, off by default.
  #   docker compose --profile tls up -d
  # Caddy then owns :80/:443 and reverse-proxies to nginx, which keeps serving
  # every route (/, /api/, /data, /dav/...). Domain and certificate issuer come
  # from DOMAIN / TLS (.env → .env.example); certificates persist in
  # volumes/certificates/. Requires ports 80 and 443 to be free on the host.
  caddy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    profiles:
      - tls
    restart: unless-stopped
    # Same host uid/gid as nginx (NGINX_UID/NGINX_GID) so the bind-mounted
    # volumes/certificates stays owned by the user instead of root:root 0700,
    # and NET_BIND_SERVICE is all it needs to keep listening on :80 and :443.
    user: "${NGINX_UID:-1000}:${NGINX_GID:-1000}"
    cap_add:
      - NET_BIND_SERVICE
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
      TLS: "${TLS:-internal}"
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - nginx
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Persists the certificates, the ACME account and Caddy's internal CA, so a
      # `down`/`up` does not re-request certs (Let's Encrypt rate limit).
      - ./volumes/certificates:/data

  zarr-viewer:
    image: ${STACK_REGISTRY:-ghcr.io/oie-mines-paristech}/stac-stack-zarr-viewer:${STACK_VERSION:-latest}
    build:
      context: ./services/zarr-viewer
      labels: *oci-labels
    volumes:
      - zarr-viewer-static:/out
    environment:
      DEV: "0"

  notebook-viewer:
    image: ${STACK_REGISTRY:-ghcr.io/oie-mines-paristech}/stac-stack-notebook-viewer:${STACK_VERSION:-latest}
    build:
      context: ./services/notebook-viewer
      labels: *oci-labels
    volumes:
      - notebook-viewer-static:/out
    environment:
      DEV: "0"

  # Zarr-subset-zip API: builds a mod_zip manifest for a subset of a Zarr v3
  # store addressed by its external URI (asset href). mod_zip itself runs in the
  # shared nginx (dynamic module), so there is no dedicated nginx container.
  # The whole data tree is mounted at the same path nginx serves it from (/data),
  # so a deep store URI (e.g. /data/fisheye/ikarus) resolves 1:1.
  zarr-subset-zip:
    image: ${STACK_REGISTRY:-ghcr.io/oie-mines-paristech}/stac-stack-zarr-subset-zip:${STACK_VERSION:-latest}
    build:
      context: ./services/zarr-subset-zip
      dockerfile: Dockerfile.api
      labels: *oci-labels
    restart: unless-stopped
    environment:
      ZARR_ROOT: /data
      ZARR_URI_PREFIX: /data
      ZARR_CACHE: /tmp/cache
    volumes:
      - ./volumes/data:/data:ro
      - zarr-subset-cache:/tmp/cache

  static-api:
    image: ${STACK_REGISTRY:-ghcr.io/oie-mines-paristech}/stac-stack-static-api:${STACK_VERSION:-latest}
    build:
      context: ./services/stac-fastapi-static
      labels: *oci-labels
    restart: unless-stopped
    depends_on:
      stac-generator:
        condition: service_healthy
    environment:
      catalog_href: file:///catalog/catalog.json
      root_path: /api/
      app_port: "80"
      app_host: "0.0.0.0"
    volumes:
      - ./volumes/catalog:/catalog:ro

volumes:
  zarr-viewer-static:
  notebook-viewer-static:
  zarr-subset-cache:
