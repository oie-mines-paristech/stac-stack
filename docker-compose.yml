services:

  stac-generator:
    # Transform Zarr / NetCDF to static stac catalog
    build: ./services/stac-generator
    environment:
      INPUT_DIR: /data # By default
      OUTPUT_DIR: /catalog # By default
      ROOT_HREF: /data # Root href for resource URLs
      WATCH_DEBOUNCE: "10"
    volumes:
      - ./volumes/data:/data:ro
      - ./volumes/catalog:/catalog

  stac-browser:
    build: ./services/stac-browser
    ports:
      - 8000:8080

    restart: unless-stopped
    environment:

      SB_catalogUrl: "/api/"
      SB_allowExternalAccess : true
      SB_itemsPerPage : 100

    depends_on:
      - static-api
      - stac-generator
    volumes:
      - ./services/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./volumes/data:/data:ro

  static-api:
    # Serve the static catalog as an API
    build: ./services/stac-fastapi-static
    environment:
      app_port: 80
      app_host: 0.0.0.0
      root_path: /api/
      catalog_href: file:///catalog/catalog.json
    volumes:
      - ./volumes/catalog:/catalog:ro

