services:
  build:
    build:
      context: .
      target: export
    image: zarr-viewer-export
    volumes:
      - static:/out

  nginx:
    image: nginx:alpine
    depends_on:
      build:
        condition: service_completed_successfully
    ports:
      - "8080:80"
    volumes:
      - static:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  static:
