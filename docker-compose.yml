services:

  stac-browser:
    build: ./services/stac-browser
    ports:
      - 80:8080
    environment:

      SB_catalogUrl: "http://localhost/api/"
      SB_allowExternalAccess : false
      SB_allowedDomains: "['localhost']"

    depends_on:
      - static-api
    volumes:
      - ./services/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  static-api:
    image: ghcr.io/fntb/stac-fastapi-static:1.0.1
    ports:
      - "8080:80"
    environment:
      app_port: 80
      app_host: 0.0.0.0
      root_path: /api/
      catalog_href: /data/catalog.json
    volumes:
      - /home/rjolivet/zarr/data/out/IEA_PVPS.zarr/:/data

