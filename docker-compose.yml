services:

  stac-browser:
    build: ./services/stac-browser
    ports:
      - 80:8080
    environment:

      SB_catalogUrl: "http://localhost/api/"
      SB_allowExternalAccess : false
      SB_allowedDomains: localhost
      SB_itemsPerPage : 20

    depends_on:
      - static-api
    volumes:
      - ./services/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data:/data:ro

  static-api:
    build: ./services/stac-fastapi-static
    # image: ghcr.io/fntb/stac-fastapi-static:1.0.1
    ports:
      - "8080:80"
    environment:
      app_port: 80
      app_host: 0.0.0.0
      root_path: /api/
      catalog_href: /data/IEA_PVPS.zarr/catalog.json
    volumes:
      - ./data/:/data:ro

