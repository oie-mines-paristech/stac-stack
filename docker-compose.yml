x-path-prefix: &path-prefix


services:

  stac-generator:
    # Transform Zarr / NetCDF to static stac catalog
    build: ./services/stac-generator
    environment:
      PATH_PREFIX: ${PATH_PREFIX:-/}
      INPUT_DIR: /data
      OUTPUT_DIR: /catalog
      WATCH_DEBOUNCE: "5"
    healthcheck:
      test: ["CMD-SHELL", "test -f /catalog/catalog.json && grep -qx OK /catalog/status.log"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    volumes:
      - ./volumes/data:/data:ro
      - ./volumes/catalog:/catalog

  stac-browser:
    build:
      context: ./services/stac-browser
      args:
        pathPrefix: ${PATH_PREFIX:-/}
    ports:
      - ${PORT:-8000}:8080
    restart: unless-stopped
    environment:
      PATH_PREFIX: ${PATH_PREFIX:-/}
      SB_allowExternalAccess: "true"
      SB_itemsPerPage: 100
    depends_on:
      static-api:
        condition: service_started
      stac-generator:
        condition: service_healthy
      zarr-viewer:
        condition: service_completed_successfully
    volumes:
      - ./services/nginx/default.conf.template:/etc/stac/nginx/default.conf.template:ro
      - ./services/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/nginx/entrypoint.sh:/docker-entrypoint.d/05-path-prefix.sh:ro
      - ./services/nginx/catalog-url.sh:/docker-entrypoint.d/45-catalog-url.sh:ro
      - ./volumes/data:/data:ro
      - zarr-viewer-static:/usr/share/nginx/html/viewer:ro

  zarr-viewer:
    build: ./services/zarr-viewer
    volumes:
      - zarr-viewer-static:/out
    environment:
      DEV: "0"

  static-api:
    # Serve the static catalog as an API
    build: ./services/stac-fastapi-static
    depends_on:
      stac-generator:
        condition: service_healthy
    environment:
      PATH_PREFIX: ${PATH_PREFIX:-/}
      app_port: 80
      app_host: 0.0.0.0
      root_path: ${PATH_PREFIX:-/}api/
      catalog_href: file:///catalog/catalog.json
    volumes:
      - ./volumes/catalog:/catalog:ro

volumes:
  zarr-viewer-static:
