[project]
name = "stac-generator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dask>=2026.3.0",
    "netcdf4>=1.7.4",
    "pydantic>=2.11.0",
    "pystac>=1.14.3",
    "pyyaml>=6.0.2",
    "rasterio>=1.5.0",
    "rioxarray>=0.22.0",
    "xarray>=2026.4.0",
    "zarr>=3.1.6",
]

[project.scripts]
generate-stac = "stac_generator.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stac_generator"]

[tool.uv]
package = true
