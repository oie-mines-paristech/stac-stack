map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Sanitize upstream X-Forwarded-Host only (never synthesize from Host — that duplicates the port).
map $http_x_forwarded_host $forwarded_host {
    ""             "";
    "~^([^,\s:]+)" $1;
    default        $http_x_forwarded_host;
}

# WebDAV LOCK/UNLOCK locks (dav-ext module).
dav_ext_lock_zone zone=webdav:1m;

# WebDAV COPY/MOVE: nginx's dav module only accepts a "Destination" header whose
# scheme+host exactly match the incoming request (http:// + same hostname as the
# "Host" header), otherwise it replies 400. Behind an HTTPS reverse proxy the
# client's Destination carries the public https URL which never matches, so any
# COPY/MOVE would fail. Every WebDAV move here is local anyway, so normalize the
# Destination down to a root-relative URI (/…): nginx's dav handler then treats
# it as an in-repository (local) move unconditionally.
map $http_destination $dav_destination {
    "~^https?://[^/]+(/.*)$" $1;
    default                  $http_destination;
}

# A WebDAV collection must be addressed with a trailing slash: without it nginx dav
# replies 409/EISDIR on DELETE and 400 "is collection" on COPY/MOVE, and it demands
# URI and Destination be consistent (both with or both without the slash).
# GVfs/Nautilus drop the trailing slash, so when a dav operation targets an existing
# directory we add it back to the URI *and* remember it in $dav_slash so the
# Destination header below gets the matching slash. See the rule in the server block.

server {
    listen ${NGINX_HTTP_PORT} default_server;
    server_name  localhost;
    absolute_redirect off;
    port_in_redirect off;

    types {
        application/javascript  js mjs;
        application/wasm        wasm;
        text/css                css;
        text/html               html;
    }

    location /api/ {
        proxy_pass http://static-api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
    }

    # WebDAV roots are mapped 1:1 from their URL to the mounted filesystem path
    # (URL /data → /data, URL /dav → /dav), so the generic trailing-slash `-d`
    # check above can use $request_filename as-is instead of a per-URL alias map.
    # Locations below have no own root/alias and inherit this.
    root /;

    set $dav_slash "";

    # MKCOL without trailing slash → 409 in nginx dav; auto-add the slash.
    # Must be in server context (`if`+`alias` inside a location is broken).
    if ($request_method = MKCOL) {
        rewrite ^(.*)[^/]$ $1/ last;
    }

    # DELETE/COPY/MOVE on an existing collection: add the trailing slash to the
    # URI and to the Destination header (see the comment before the server block).
    # `root /` above makes $request_filename equal the real mounted path, so this
    # one generic filesystem check replaces any per-URL alias/path mapping.
    if (-d $request_filename) {
        set $dav_slash "/";
        rewrite ^(.*[^/])$ $1/ last;
    }

    # No trailing slash on purpose: GVfs (Nautilus) sends "OPTIONS /data"
    # without the slash (it normalizes the mount prefix), and a /data/ location
    # would not match → "share does not support WebDAV". Serves the mounted
    # ./volumes/data directly (root / inherited → URL == filesystem path).
    location ^~ /data {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # WebDAV/HTTP: read (GET, PROPFIND, autoindex) is public; every writing
        # method (PUT/DELETE/MKCOL/COPY/MOVE/LOCK/UNLOCK) requires the admin.
        # The full-authenticated admin WebDAV root lives at /dav.
        # (DELETE/MKCOL trailing-slash fixes run at server level, see above.)
        client_max_body_size 0;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;
        dav_methods PUT DELETE MKCOL COPY MOVE;
        dav_ext_methods PROPFIND OPTIONS LOCK UNLOCK;
        dav_ext_lock zone=webdav;
        more_set_input_headers "Destination: $dav_destination$dav_slash";

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS, PROPFIND" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type, Accept, Authorization, X-Requested-With, Depth" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

        limit_except GET HEAD OPTIONS PROPFIND {
            auth_basic "WebDAV admin";
            auth_basic_user_file /etc/nginx/htpasswd;
        }
    }

    # WebDAV root for admins: dav://<host>/dav shows ./data (rw) and ./catalog
    # (ro, debug: status.log, catalog.json). Same auth policy as /data — OPTIONS
    # public for GVfs discovery, everything else requires the admin. /catalog is
    # NOT exposed via any public HTTP route (no location serves it); it only
    # exists under this authenticated /dav tree.
    # (DELETE/MKCOL trailing-slash fixes run at server level, see above.)
    location ^~ /dav {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        client_max_body_size 0;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;
        dav_methods PUT DELETE MKCOL COPY MOVE;
        dav_ext_methods PROPFIND OPTIONS LOCK UNLOCK;
        dav_ext_lock zone=webdav;
        more_set_input_headers "Destination: $dav_destination$dav_slash";

        limit_except OPTIONS {
            auth_basic "WebDAV admin";
            auth_basic_user_file /etc/nginx/htpasswd;
        }
    }

    # Same-origin proxy for cross-origin Zarr stores (CORS bypass).
    # Matches /viewer/proxy/https/... and /proxy/https/...
    location ~ ^(/.*)?/proxy/(?<upstream_scheme>https?)/(?<upstream_host>[^/]+)(?<upstream_path>/.*)$ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Range" always;
            return 204;
        }

        set $upstream $upstream_scheme://$upstream_host$upstream_path$is_args$args;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $upstream_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Range $http_range;
        proxy_ssl_server_name on;
        proxy_buffering off;
    }

    location /viewer/ {
        alias /usr/share/nginx/html/viewer/;
        index index.html;
        try_files $uri $uri/ /viewer/index.html;
    }

    location / {
        proxy_pass http://browser:8081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_read_timeout 86400;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
