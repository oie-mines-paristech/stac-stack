# Workers run as the "webdav" user (see 10-user.sh: entry created in /etc/passwd
# with the uid/gid from NGINX_UID/NGINX_GID in .env). Files written to /data are
# then owned by the host user — no chmod needed to share volumes/data.
# ngx_http_dav_module (PUT/DELETE/MKCOL/COPY/MOVE) is compiled into the official
# base; dav-ext (PROPFIND/PROPPATCH/LOCK/UNLOCK), mod_zip and headers-more (the
# `more_set_input_headers "Destination: …"` that dav-ext needs on MOVE/COPY) are
# built as dynamic modules in the Dockerfile (services/nginx/Dockerfile) and
# installed at /usr/lib/nginx/modules — loaded here in the main context.
load_module /usr/lib/nginx/modules/ngx_http_dav_ext_module.so;
load_module /usr/lib/nginx/modules/ngx_http_zip_module.so;
load_module /usr/lib/nginx/modules/ngx_http_headers_more_filter_module.so;
user  webdav webdav;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    include /etc/nginx/conf.d/*.conf;
}