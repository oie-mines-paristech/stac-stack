# Workers run as the "webdav" user (see 10-user.sh: entry created in /etc/passwd
# with the uid/gid from NGINX_UID/NGINX_GID in .env). Files written to /data are
# then owned by the host user — no chmod needed to share volumes/data.
# (dav-ext is compiled statically into the hakwerk/nginx-dav base — no load_module.)
user  webdav webdav;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    include /etc/nginx/conf.d/*.conf;
}