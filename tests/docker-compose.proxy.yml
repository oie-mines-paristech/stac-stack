# Overlay compose : nginx du stack exposé en HTTPS pour les tests E2E (cert auto-signé).

services:
  nginx:
    environment:
      NGINX_HTTPS_PORT: "8443"
    ports:
      - "${HTTPS_PORT:-18443}:8443"
    volumes:
      - ./tests/certs:/etc/nginx/certs:ro
      - ./services/nginx/default.conf.https:/etc/nginx/templates/default-ssl.conf.template:ro
