# ---------------------------------------------------------------------------
# A Collection of data cubes: a NetCDF climatology and an ERA5 Zarr subset.
#
# The generator opens each dataset with xarray/CF and infers spatial extent,
# temporal extent, datacube dimensions and bands. The ERA5 store keeps its
# original Zarr encoding (v2, one global map per chunk) so the Zarr viewer can
# be exercised on a "time-chunked" cube.
# ---------------------------------------------------------------------------

title: Data cube
description: >-
  Example data cubes. A BRDF/albedo climatology stored as NetCDF, and a
  two-day ERA5 2 m temperature subset stored as a Zarr cube holding one global
  map per timestamp. Everything specific to each dataset is inferred from the
  file.

# Collection-level metadata.
license: CC-BY-4.0
keywords: [data cube, climatology, ERA5, temperature, demo]
providers:
  - name: OIE - Mines Paris - PSL
    roles: [producer, host]
    url: https://www.oie.minesparis.psl.eu/
created: "2024-09-12T00:00:00Z"
updated: "2026-09-30T00:00:00Z"

# `doi` and `citation` add the Scientific Citation extension to the collection.
doi: 10.1234/stac-stack.cube
citation: "Example citation for the STAC Stack data-cube collection (2026)."

# `items` accepts a glob, or an object with per-item overrides.
items:
  - cube-climatology.nc
  - path: era5-t2m.zarr
    properties:
      title: ERA5 2 m temperature (2 days)
