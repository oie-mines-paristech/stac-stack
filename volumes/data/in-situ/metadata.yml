# ---------------------------------------------------------------------------
# A sub-catalog of remote THREDDS networks, reduced here to one representative
# network. Every entry is an inline collection whose `thredds` source is a
# remote catalog: nothing is downloaded, each dataset becomes an Item read over
# OPeNDAP.
# ---------------------------------------------------------------------------

id: in-situ
title: In situ irradiance datasets
description: >-
  OIE's Web Service Energy gathers high quality, minute resolution, in-situ data
  of solar irradiance from various, heterogeneous networks. We process them into
  standard NetCDF files, following CF conventions, and redistribute them freely
  on a THREDDS Data Server. This example catalog carries a single network
  (IEA-PVPS).

children:
  # A remote THREDDS source. `item_template` is applied to every item of the
  # collection, rendered once per dataset: {station_id} is a scalar property of
  # every item, so each station gets its own QC plot. The custom role keeps
  # STAC Browser from promoting it to the item preview.
  - id: iea-pvps
    thredds:
      url: https://tds.webservice-energy.org/thredds/catalog/iea-pvps/catalog.xml
      max_depth: 0
      exclude: ["index.nc"]
      refresh: 600
    links:
      - rel: describedby
        href: https://tds.webservice-energy.org/thredds/catalog/iea-pvps/catalog.html
        type: text/html
        title: THREDDS catalog
    item_template:
      assets:
        - name: qc
          title: Quality control plot
          description: Multi-plot QC report of the station, published alongside the dataset.
          roles: [QC]
          mime: image/png
          href: https://tds.webservice-energy.org/thredds/fileServer/iea-pvps/qc/{station_id}.png
