# ---------------------------------------------------------------------------
# All the networks of the Copernicus in-situ TDS that publish data:
# https://tds.webservice-energy.org/thredds/catalog/in-situ.xml
#
# Every entry is an inline collection whose `thredds` source is a remote
# catalog — nothing is downloaded, each dataset becomes an Item read over
# OPeNDAP. The `_references` block below is an ignored container for the
# reusable YAML fragments factored with anchors: &depth (stop before the nested
# qc/ catalogRef), &tds-auth (the 8 credential-protected networks), &qc (the
# shared QC asset block, each collection overriding only its `href` through
# `<<` merge) and &catalog-link (the static HTML catalog link every network
# declares). The generator never reads `_references`; YAML itself resolves the
# anchors.
# ---------------------------------------------------------------------------

id: in-situ
title: In situ irradiance datasets
description: >-
  
  OIE's Web Service Energy gathers high quality, minute resolution, insitu data of solar irradiance 
  from various, herogenous networks. 
  
  We process them into standard NetCDF files, following CF conventions and redistribute it freely on a Thredds server.

  We cover 16 networks, for more than 600 stations in total.


# Ignored container for reusable YAML blocks (anchors referenced below).
_references:
  depth: &depth 0
  tds-auth: &tds-auth
    login: "{THREDDS_LOGIN}"
    password: "render_placeholders(spec.auth.password,"
  qc: &qc
    name: qc
    title: Quality control plot
    description: Multi-plot QC report of the station, published alongside the dataset.
    roles: [QC]
    mime: image/png
  catalog-link: &catalog-link
    rel: describedby
    type: text/html
    title: THREDDS catalog

children:
  # The catalog's only nested catalogRef holds QC PNG plots, not datasets.
  # Cold build ~9 s over 94 stations, then served from the /cache TTL until
  # `refresh` elapses. Set `workers: 1` to read them sequentially.
  - id: iea-pvps
    thredds:
      url: https://tds.webservice-energy.org/thredds/catalog/iea-pvps/catalog.xml
      exclude: ["index.nc"]
      max_depth: *depth
      refresh: 600
    links:
      - <<: *catalog-link
        href: https://tds.webservice-energy.org/thredds/catalog/iea-pvps/catalog.html
    # `item_template` is applied to every item of the collection, rendered once
    # per dataset: {station_id} is a scalar property of every item (ADR, BOU,
    # ...), so each station gets its own QC plot. The custom role keeps STAC
    # Browser from promoting it to the item preview.
    item_template:
      assets:
        - <<: *qc
          href: https://tds.webservice-energy.org/thredds/fileServer/iea-pvps/qc/{station_id}.png

  # Protected server: the catalog XML, the OPeNDAP reads and the downloads all
  # send HTTP basic credentials from the environment ({VAR} placeholders, so
  # the secret stays out of this file, of the cache and of the catalog). The
  # items carry the authentication extension, so STAC Browser prompts the end
  # user for their own credentials before handing out an href. Its qc/ plots
  # sit behind the same auth, so they are not attached as public assets.
  - id: bsrn
    thredds:
      url: https://tds.webservice-energy.org/thredds/catalog/bsrn-stations/catalog.xml
      max_depth: *depth
      exclude: ["index.nc"]
      auth: *tds-auth
    links:
      - <<: *catalog-link
        href: https://tds.webservice-energy.org/thredds/catalog/bsrn-stations/catalog.html

  # -- Protected networks (same credentials, QC plots stay private) -------
